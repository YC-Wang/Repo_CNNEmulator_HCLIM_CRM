metadata:
  experiment_id: "pr_example"
  dataset_version: "FPS_HCLIM43_INTERIM"
  notes: "Standardized precipitation CNN with MSE"

paths:
  predictor_file: "../data_sample/train_data/combined_12km_6hr_20000101-20091231.nc"
  target_file: "../data_sample/infer_data/pr_3km_6hr_200001010300-200912312100.nc"
  output_root: "../outputs"

experiment:
  variable: "pr"
  target_scale: 86400.0
  working_units: "mm day-1"
  std_epsilon: 1.0e-6
  predictor_time_offset_hours: 3
  dates:
    train: ["2000-01-01", "2007-12-31"]
    val: ["2008-01-01", "2008-12-31"]
    test: ["2009-01-01", "2009-12-31"]
  downscale_variables:
    - phi500
    - phi700
    - phi850
    - phi950
    - ta500
    - ta700
    - ta850
    - ta950
    - ua500
    - ua700
    - ua850
    - ua950
    - va500
    - va700
    - va850
    - va950
    - hus500
    - hus700
    - hus850
    - hus950
    - mrsol

model:
  hidden_layer_dense: 256
  kernel_size: 5
  layer_filters: [16, 32, 64]
  dropout: 0.6
  dense_activation: "selu"
  cnn_activation: "selu"
  padding: "valid"
  use_bn: true
  use_pooling: true

training:
  learning_rate: 0.0001
  batch_size: 64
  epochs: 300
  loss: "mse"
  metrics: "mse"

inference:
  batch_size: 32
  calculate_test_metrics: true
  clip_negative_rainfall: false
  saved_output_units: "scaled"
