metadata:
  experiment_id: "ECE-HM2HM"
  dataset_version: "EC-Earth_HM_to_HM"
  notes: "EC-Earth hybrid historical-plus-mid-century precipitation CNN with sequential segmented training"

paths:
  predictor_file: "/nobackup/rossby27/users/sm_yicwa/PROJECTS/01-PROJ_emulator/01-rampal2021-unet/Emulator_ECEARTH_T_withSM_whus/training_data_fuxing_ecearth_withSM/combined_12km_6hr_199501010000-200512311800_withmrsol_whus.nc"
  target_file: "/nobackup/rossby26/users/sm_fuxwa/AI/Emilia_Romagna/cropped/ICHEC-EC-EARTH_HIST/3km/6hr/pr_3km_6hr_199501010300-200512312100.nc"
  output_root: "../outputs"

experiment:
  variable: "pr"
  target_scale: 86400.0
  working_units: "mm day-1"
  std_epsilon: 1.0e-6
  predictor_time_offset_hours: 3
  dates:
    train: ["2001-01-01", "2004-12-31"]
    val: ["2005-01-01", "2005-12-31"]
    test: ["2050-01-01", "2050-12-31"]
  downscale_variables:
    - phi500
    - phi700
    - phi850
    - phi950
    - ta500
    - ta700
    - ta850
    - ta950
    - ua500
    - ua700
    - ua850
    - ua950
    - va500
    - va700
    - va850
    - va950
    - hus500
    - hus700
    - hus850
    - hus950
    - mrsol

model:
  hidden_layer_dense: 256
  kernel_size: 5
  layer_filters: [16, 32, 64]
  dropout: 0.6
  dense_activation: "selu"
  cnn_activation: "selu"
  padding: "valid"
  use_bn: true
  use_pooling: true

training:
  learning_rate: 0.0001
  batch_size: 64
  epochs: 300
  loss: "mse"
  metrics: "mse"
  sequential_segments: true
  segments:
