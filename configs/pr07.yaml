      target_file: "/nobackup/rossby26/users/sm_fuxwa/AI/Emilia_Romagna/cropped/ICHEC-EC-EARTH_HIST/3km/6hr/pr_3km_6hr_199501010300-200512312100.nc"
      dates: ["2005-01-01", "2005-12-31"]

