metadata:
  experiment_id: "exp1_normal_withT"
  dataset_version: "FPS_HCLIM43_ITERIM"
  preprocessing: "standardized_per_grid"
  institution: "SMHI"
  notes: "This is the config for clean repository."

paths:
  predictor_file: "/nobackup/rossby27/users/sm_yicwa/PROJECTS/01-PROJ_emulator/01-rampal2021-unet/Emulator_HCLIM_CRM_T_withSM_whus/training_data_fuxing/combined_12km_6hr_20000101-20091231_swapped_2003_2009_withT.nc"
  target_file: "/nobackup/rossby27/users/sm_yicwa/PROJECTS/01-PROJ_emulator/01-rampal2021-unet/Emulator_HCLIM_CRM_T_withSM_whus/training_data_fuxing/Emilia_Romagna/tas_3km_6hr_200001010000-200912311800_swapped_2003_2009.nc"
  output_root: "./outputs"

experiment:
  variable: "tas"
  target_scale: 1.0
  std_epsilon: 1.0e-6
  predictor_time_offset_hours: 0
  dates:
    train: ["2000-01-01", "2007-12-31"]
    val: ["2008-01-01", "2008-12-31"]
    test: ["2009-01-01", "2009-12-31"]
  downscale_variables:
    - phi500
    - phi700
    - phi850
    - phi950
    - ta500
    - ta700
    - ta850
    - ta950
    - ua500
    - ua700
    - ua850
    - ua950
    - va500
    - va700
    - va850
    - va950
    - hus500
    - hus700
    - hus850
    - hus950
    - tas
    - mrsol

model:
  hidden_layer_dense: 256
  kernel_size: 5
  layer_filters: [16, 32, 64]
  dropout: 0.6
  dense_activation: "selu"
  cnn_activation: "selu"
  padding: "valid"
  use_bn: true
  use_pooling: true

training:
  learning_rate: 0.0001
  batch_size: 64
  epochs: 300
  loss: "mse"
  metrics: "mse"
  model_type: "cnn"
  experiment_tag: "exp1_heatwave_withT"
  overwrite_existing: false

inference:
  run_name: "test"
  dates: ["2009-01-01", "2009-12-31"]
  batch_size: 32
  calculate_test_metrics: true
  clip_negative_rainfall: false
  saved_output_units: "scaled"
  prediction_filename: "prediction.nc"
  metrics_filename: "evaluation_metrics.csv"
  overwrite_existing: false
